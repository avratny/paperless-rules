services:
    paperless-rules:
        build:
            context: '.'
            dockerfile: docker/Dockerfile
        image: 'avratny/paperless-rules'
        ports:
            - '80:80'
        networks:
            - sail
        depends_on:
            - mariadb
        environment:
            APP_KEY: 'base64:x7YiUB3EIqNxE1QeY50EDcUKRh3vdcnvqWqZ6uGNSdw='
            APP_URL: 'http://localhost'
            DB_CONNECTION: mysql
            DB_HOST: mariadb
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: sail
            DB_PASSWORD: password
    mariadb:
        image: 'mariadb:11'
        environment:
            MYSQL_ROOT_PASSWORD: 'password'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: 'laravel'
            MYSQL_USER: 'sail'
            MYSQL_PASSWORD: 'password'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
